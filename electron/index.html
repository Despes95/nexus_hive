<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus Hive v1.0</title>

    <!-- Markdown rendering -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
      /* ========================================================================
           NEXUS HIVE v8 - CYBERPUNK INTERFACE
           ======================================================================== */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Consolas", "Monaco", "Courier New", monospace;
        background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 100%);
        color: #e0e0e0;
        height: 100vh;
        overflow: hidden;
      }

      /* === LAYOUT === */
      #app {
        display: grid;
        grid-template-columns: 300px 1fr;
        grid-template-rows: 60px 1fr;
        height: 100vh;
        gap: 1px;
        background: #0a0e27;
      }

      /* === HEADER === */
      #header {
        grid-column: 1 / -1;
        background: linear-gradient(90deg, #16213e 0%, #0f3460 100%);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        border-bottom: 2px solid #00d9ff;
        box-shadow: 0 2px 10px rgba(0, 217, 255, 0.3);
      }

      #header h1 {
        font-size: 24px;
        color: #00d9ff;
        text-shadow: 0 0 10px #00d9ff;
        letter-spacing: 2px;
      }

      .header-actions {
        display: flex;
        gap: 10px;
      }

      .btn-header {
        background: rgba(0, 217, 255, 0.1);
        border: 1px solid #00d9ff;
        color: #00d9ff;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.3s;
        font-size: 12px;
      }

      .btn-header:hover {
        background: rgba(0, 217, 255, 0.3);
        box-shadow: 0 0 10px #00d9ff;
      }

      /* === SIDEBAR === */
      #sidebar {
        background: #16213e;
        border-right: 1px solid #00d9ff;
        padding: 20px;
        overflow-y: auto;
      }

      .dashboard-section {
        margin-bottom: 30px;
      }

      .dashboard-section h2 {
        font-size: 14px;
        color: #00d9ff;
        margin-bottom: 15px;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-bottom: 1px solid rgba(0, 217, 255, 0.3);
        padding-bottom: 5px;
      }

      .metric-item {
        background: rgba(0, 217, 255, 0.05);
        padding: 12px;
        margin-bottom: 10px;
        border-radius: 4px;
        border-left: 3px solid #00d9ff;
      }

      .metric-label {
        font-size: 11px;
        color: #888;
        margin-bottom: 5px;
      }

      .metric-value {
        font-size: 18px;
        color: #00d9ff;
        font-weight: bold;
      }

      .progress-bar {
        width: 100%;
        height: 6px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
        overflow: hidden;
        margin-top: 5px;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #00d9ff, #00ffc8);
        transition: width 0.3s;
      }

      .progress-fill.danger {
        background: linear-gradient(90deg, #ff006e, #ff4d4d);
      }

      .agent-badge {
        display: inline-block;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid #555;
        padding: 6px 12px;
        border-radius: 4px;
        font-size: 12px;
        color: #888;
      }

      .agent-badge.active {
        background: rgba(0, 217, 255, 0.2);
        border-color: #00d9ff;
        color: #00d9ff;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          box-shadow: 0 0 5px #00d9ff;
        }
        50% {
          box-shadow: 0 0 15px #00d9ff;
        }
      }

      /* === MAIN CHAT === */
      #main {
        display: flex;
        flex-direction: column;
        background: #0f1419;
        min-height: 0;
      }

      #chat-container {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        min-height: 0;
      }

      #chat-messages {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      /* === MESSAGES === */
      .message {
        padding: 15px;
        border-radius: 8px;
        max-width: 80%;
        animation: fadeIn 0.3s;
        /* FIX COPIER-COLLER : permettre la sélection de texte */
        user-select: text;
        -webkit-user-select: text;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message-user {
        background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
        border-left: 4px solid #00d9ff;
        align-self: flex-end;
      }

      .message-assistant {
        background: rgba(255, 255, 255, 0.03);
        border-left: 4px solid #00ffc8;
        align-self: flex-start;
      }

      .message-system {
        background: rgba(255, 255, 255, 0.05);
        border-left: 4px solid #888;
        align-self: center;
        font-size: 12px;
        color: #aaa;
        padding: 8px 12px;
      }

      .message-system.error {
        background: rgba(255, 0, 110, 0.1);
        border-color: #ff006e;
        color: #ff006e;
      }

      .message-system.success {
        background: rgba(0, 255, 200, 0.1);
        border-color: #00ffc8;
        color: #00ffc8;
      }

      .agent-label {
        font-size: 11px;
        color: #00d9ff;
        margin-bottom: 5px;
        font-weight: bold;
      }

      .message-content {
        color: #e0e0e0;
        line-height: 1.6;
        word-wrap: break-word;
        /* Permettre la sélection de texte */
        user-select: text;
        -webkit-user-select: text;
      }

      /* === MARKDOWN DANS LES MESSAGES === */
      .message-content p {
        margin-bottom: 8px;
      }

      .message-content p:last-child {
        margin-bottom: 0;
      }

      .message-content pre {
        background: #0d1117;
        border: 1px solid #30363d;
        border-radius: 6px;
        padding: 12px;
        margin: 8px 0;
        overflow-x: auto;
        position: relative;
      }

      .message-content code {
        font-family: "Consolas", "Monaco", "Courier New", monospace;
        font-size: 13px;
      }

      .message-content :not(pre) > code {
        background: rgba(0, 217, 255, 0.1);
        border: 1px solid rgba(0, 217, 255, 0.2);
        padding: 2px 6px;
        border-radius: 3px;
        font-size: 12px;
        color: #00d9ff;
      }

      .message-content ul,
      .message-content ol {
        margin: 8px 0;
        padding-left: 24px;
      }

      .message-content li {
        margin-bottom: 4px;
      }

      .message-content blockquote {
        border-left: 3px solid #00d9ff;
        padding-left: 12px;
        color: #aaa;
        margin: 8px 0;
      }

      .message-content h1,
      .message-content h2,
      .message-content h3 {
        color: #00d9ff;
        margin: 12px 0 6px 0;
      }

      .message-content h1 {
        font-size: 18px;
      }
      .message-content h2 {
        font-size: 16px;
      }
      .message-content h3 {
        font-size: 14px;
      }

      .message-content a {
        color: #00d9ff;
        text-decoration: underline;
      }

      .message-content table {
        border-collapse: collapse;
        margin: 8px 0;
        width: 100%;
      }

      .message-content th,
      .message-content td {
        border: 1px solid #30363d;
        padding: 6px 10px;
        text-align: left;
      }

      .message-content th {
        background: rgba(0, 217, 255, 0.1);
        color: #00d9ff;
      }

      /* Bouton copier code */
      .code-copy-btn {
        position: absolute;
        top: 6px;
        right: 6px;
        background: rgba(0, 217, 255, 0.15);
        border: 1px solid rgba(0, 217, 255, 0.3);
        color: #00d9ff;
        padding: 3px 8px;
        border-radius: 3px;
        cursor: pointer;
        font-size: 11px;
        opacity: 0;
        transition: opacity 0.2s;
      }

      .message-content pre:hover .code-copy-btn {
        opacity: 1;
      }

      .code-copy-btn:hover {
        background: rgba(0, 217, 255, 0.3);
      }

      /* === HISTORIQUE CONVERSATIONS === */
      .conv-item {
        padding: 8px 10px;
        margin-bottom: 4px;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.2s;
        border-left: 3px solid transparent;
      }

      .conv-item:hover {
        background: rgba(0, 217, 255, 0.1);
        border-left-color: #00d9ff;
      }

      .conv-item.active {
        background: rgba(0, 217, 255, 0.15);
        border-left-color: #00ffc8;
      }

      .conv-title {
        font-size: 12px;
        color: #e0e0e0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .conv-meta {
        font-size: 10px;
        color: #666;
        margin-top: 2px;
      }

      .conv-delete {
        color: #555;
        cursor: pointer;
        font-size: 14px;
        padding: 0 4px;
        margin-left: 4px;
        opacity: 0.5;
        transition: all 0.2s;
      }

      .conv-delete:hover {
        color: #ff006e;
        opacity: 1;
      }

      /* === INPUT ZONE === */
      #input-zone {
        background: #16213e;
        padding: 20px;
        border-top: 1px solid #00d9ff;
      }

      /* === ATTACHMENTS PREVIEW === */
      #attachments-preview {
        display: flex;
        gap: 10px;
        padding: 0 0 12px 0;
        flex-wrap: wrap;
      }

      #attachments-preview:empty {
        display: none;
      }

      .attachment-item {
        position: relative;
        background: rgba(0, 217, 255, 0.08);
        border: 1px solid rgba(0, 217, 255, 0.3);
        border-radius: 6px;
        padding: 6px;
        display: flex;
        align-items: center;
        gap: 8px;
        animation: fadeIn 0.3s;
      }

      .attachment-item img {
        width: 48px;
        height: 48px;
        object-fit: cover;
        border-radius: 4px;
        border: 1px solid rgba(0, 217, 255, 0.2);
      }

      .attachment-item .file-icon {
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 217, 255, 0.15);
        border-radius: 4px;
        font-size: 20px;
      }

      .attachment-info {
        display: flex;
        flex-direction: column;
        max-width: 140px;
      }

      .attachment-name {
        font-size: 11px;
        color: #e0e0e0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .attachment-size {
        font-size: 10px;
        color: #888;
      }

      .attachment-remove {
        position: absolute;
        top: -6px;
        right: -6px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #ff006e;
        border: none;
        color: #fff;
        font-size: 11px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
        line-height: 1;
      }

      .attachment-remove:hover {
        background: #ff4d4d;
        transform: scale(1.2);
        box-shadow: 0 0 8px rgba(255, 0, 110, 0.6);
      }

      #input-container {
        display: flex;
        gap: 10px;
        align-items: flex-end;
      }

      #attach-btn {
        background: rgba(0, 217, 255, 0.1);
        border: 1px solid rgba(0, 217, 255, 0.4);
        color: #00d9ff;
        width: 44px;
        height: 44px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s;
        flex-shrink: 0;
      }

      #attach-btn:hover {
        background: rgba(0, 217, 255, 0.25);
        box-shadow: 0 0 12px rgba(0, 217, 255, 0.4);
        border-color: #00d9ff;
      }

      #attach-btn.has-files {
        background: rgba(0, 255, 200, 0.15);
        border-color: #00ffc8;
        color: #00ffc8;
        animation: pulse 2s infinite;
      }

      #file-input {
        display: none;
      }

      #user-input {
        flex: 1;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid #00d9ff;
        color: #e0e0e0;
        padding: 12px;
        border-radius: 4px;
        font-family: inherit;
        font-size: 14px;
        resize: none;
        min-height: 50px;
        max-height: 200px;
      }

      #user-input:focus {
        outline: none;
        box-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
      }

      #send-btn {
        background: linear-gradient(135deg, #00d9ff 0%, #00ffc8 100%);
        border: none;
        color: #0a0e27;
        padding: 12px 30px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        transition: all 0.3s;
      }

      #send-btn:hover {
        box-shadow: 0 0 20px #00d9ff;
        transform: translateY(-2px);
      }

      #send-btn:active {
        transform: translateY(0);
      }

      /* === SCROLLBAR === */
      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: #0a0e27;
      }

      ::-webkit-scrollbar-thumb {
        background: #00d9ff;
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #00ffc8;
      }

      /* === SOURCES === */
      #sources-container {
        margin-top: 20px;
        padding: 15px;
        background: rgba(0, 217, 255, 0.05);
        border-radius: 4px;
      }

      #sources-container h3 {
        font-size: 14px;
        color: #00d9ff;
        margin-bottom: 10px;
      }

      .source-item {
        display: flex;
        gap: 10px;
        padding: 8px;
        margin-bottom: 8px;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 4px;
      }

      .source-index {
        color: #00d9ff;
        font-weight: bold;
        min-width: 20px;
      }

      .source-title {
        font-size: 12px;
        color: #e0e0e0;
        margin-bottom: 3px;
      }

      .source-url {
        font-size: 10px;
        color: #888;
        text-decoration: none;
      }

      .source-url:hover {
        color: #00d9ff;
      }

      /* === SOURCES EN BAS DE RÉPONSE === */
      .sources-badge-wrapper {
        margin-top: 10px;
        border-top: 1px solid rgba(0, 217, 255, 0.15);
        padding-top: 8px;
      }

      .sources-badge {
        background: rgba(0, 217, 255, 0.08);
        border: 1px solid rgba(0, 217, 255, 0.35);
        color: #00d9ff;
        padding: 4px 12px;
        border-radius: 12px;
        cursor: pointer;
        font-size: 12px;
        font-family: inherit;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .sources-badge:hover {
        background: rgba(0, 217, 255, 0.2);
        box-shadow: 0 0 8px rgba(0, 217, 255, 0.3);
      }

      .sources-badge.open {
        background: rgba(0, 217, 255, 0.18);
        border-color: #00d9ff;
      }

      .sources-badge::after {
        content: " ▾";
        font-size: 10px;
        transition: transform 0.2s;
      }

      .sources-badge.open::after {
        content: " ▴";
      }

      .sources-list {
        margin-top: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .sources-list .source-item {
        display: flex;
        gap: 10px;
        padding: 7px 10px;
        background: rgba(0, 0, 0, 0.25);
        border: 1px solid rgba(0, 217, 255, 0.12);
        border-radius: 4px;
        align-items: flex-start;
      }

      .sources-list .source-index {
        color: #00d9ff;
        font-weight: bold;
        min-width: 18px;
        font-size: 12px;
        padding-top: 1px;
      }

      .sources-list .source-title {
        font-size: 12px;
        color: #e0e0e0;
        margin-bottom: 2px;
      }

      .sources-list .source-url {
        font-size: 10px;
        color: #666;
        text-decoration: none;
        word-break: break-all;
      }

      .sources-list .source-url:hover {
        color: #00d9ff;
        text-decoration: underline;
      }

      /* === STATUS === */
      .status-indicator {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #555;
        display: inline-block;
        margin-right: 8px;
      }

      .status-indicator.ready {
        background: #00ffc8;
        box-shadow: 0 0 10px #00ffc8;
      }

      .status-indicator.processing {
        background: #00d9ff;
        animation: blink 1s infinite;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }

      /* === SÉLECTEUR MODE === */
      .mode-selector,
      .agent-selector,
      .pipeline-selector {
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(0, 217, 255, 0.4);
        color: #e0e0e0;
        padding: 8px 12px;
        border-radius: 4px;
        font-family: inherit;
        font-size: 12px;
        cursor: pointer;
        min-width: 90px;
        transition: all 0.2s;
      }

      .mode-selector:hover,
      .agent-selector:hover,
      .pipeline-selector:hover {
        border-color: #00d9ff;
        box-shadow: 0 0 8px rgba(0, 217, 255, 0.3);
      }

      .mode-selector:focus,
      .agent-selector:focus,
      .pipeline-selector:focus {
        outline: none;
        border-color: #00d9ff;
        box-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
      }

      .mode-selector option,
      .agent-selector option,
      .pipeline-selector option {
        background: #16213e;
        color: #e0e0e0;
        padding: 8px;
      }

      /* Agent/Pipeline selector visible state */
      .agent-selector.visible,
      .pipeline-selector.visible {
        display: inline-block !important;
      }

      /* === BOUTON + AVEC SOUS-MENU === */
      .attach-wrapper {
        position: relative;
        display: inline-block;
      }

      #attach-btn {
        background: rgba(0, 217, 255, 0.1);
        border: 1px solid rgba(0, 217, 255, 0.4);
        color: #00d9ff;
        width: 44px;
        height: 44px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s;
        flex-shrink: 0;
      }

      #attach-btn:hover {
        background: rgba(0, 217, 255, 0.25);
        box-shadow: 0 0 12px rgba(0, 217, 255, 0.4);
        border-color: #00d9ff;
      }

      #attach-btn.has-files {
        background: rgba(0, 255, 200, 0.15);
        border-color: #00ffc8;
        color: #00ffc8;
        animation: pulse 2s infinite;
      }

      /* Dropdown menu */
      .attach-dropdown {
        position: absolute;
        bottom: 100%;
        left: 0;
        margin-bottom: 8px;
        background: #16213e;
        border: 1px solid rgba(0, 217, 255, 0.4);
        border-radius: 6px;
        padding: 6px 0;
        min-width: 160px;
        display: none;
        z-index: 1000;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      }

      .attach-dropdown.show {
        display: block;
        animation: fadeIn 0.2s;
      }

      .attach-dropdown-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        color: #e0e0e0;
        cursor: pointer;
        font-size: 13px;
        transition: all 0.15s;
      }

      .attach-dropdown-item:hover {
        background: rgba(0, 217, 255, 0.15);
        color: #00d9ff;
      }

      .attach-dropdown-item .icon {
        font-size: 16px;
        width: 24px;
        text-align: center;
      }

      .attach-dropdown-divider {
        height: 1px;
        background: rgba(0, 217, 255, 0.2);
        margin: 4px 0;
      }

      /* === MODAL DE CONFIRMATION === */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s;
      }

      .modal-overlay.show {
        opacity: 1;
        visibility: visible;
      }

      .modal-content {
        background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
        border: 1px solid #00d9ff;
        border-radius: 8px;
        padding: 24px;
        max-width: 400px;
        width: 90%;
        box-shadow: 0 0 30px rgba(0, 217, 255, 0.3);
        transform: scale(0.9);
        transition: transform 0.3s;
      }

      .modal-overlay.show .modal-content {
        transform: scale(1);
      }

      .modal-title {
        font-size: 18px;
        color: #00d9ff;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .modal-message {
        color: #e0e0e0;
        font-size: 14px;
        margin-bottom: 24px;
        line-height: 1.6;
      }

      .modal-buttons {
        display: flex;
        gap: 12px;
        justify-content: flex-end;
      }

      .modal-btn {
        padding: 10px 20px;
        border-radius: 4px;
        font-size: 13px;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.3s;
        border: 1px solid;
      }

      .modal-btn-cancel {
        background: rgba(255, 255, 255, 0.05);
        border-color: #555;
        color: #aaa;
      }

      .modal-btn-cancel:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #e0e0e0;
      }

      .modal-btn-confirm {
        background: rgba(255, 0, 110, 0.2);
        border-color: #ff006e;
        color: #ff006e;
      }

      .modal-btn-confirm:hover {
        background: rgba(255, 0, 110, 0.4);
        box-shadow: 0 0 15px rgba(255, 0, 110, 0.4);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- HEADER -->
      <div id="header">
        <h1>
          ⚡ NEXUS HIVE
          <span id="version-label" style="font-size: 12px; color: #888"
            >v1.0</span
          >
        </h1>
        <div class="header-actions">
          <button class="btn-header" id="btn-newchat">💬 Nouveau</button>
          <button class="btn-header" id="btn-reset">🔄 Reset</button>
          <button class="btn-header" id="btn-gpu">📊 GPU</button>
          <button class="btn-header" id="btn-export">💾 Export</button>
          <button class="btn-header" id="btn-restart">⚠️ Restart</button>
          <span class="status-indicator" id="status-indicator"></span>
        </div>
      </div>

      <!-- SIDEBAR -->
      <div id="sidebar">
        <div class="dashboard-section">
          <h2>🎯 Pulse Dashboard</h2>

          <div class="metric-item">
            <div class="metric-label">Tokens/s</div>
            <div class="metric-value" id="metric-tokens">0</div>
          </div>

          <div class="metric-item">
            <div class="metric-label">VRAM Usage</div>
            <div class="metric-value" id="metric-vram" style="font-size: 12px">
              0/0MB
            </div>
            <div class="progress-bar">
              <div class="progress-fill" id="vram-bar" style="width: 0%"></div>
            </div>
          </div>

          <div class="metric-item">
            <div class="metric-label">GPU Utilization</div>
            <div class="metric-value" id="metric-gpu">0%</div>
          </div>

          <div class="metric-item">
            <div class="metric-label">Temperature</div>
            <div class="metric-value" id="metric-temp">0°C</div>
          </div>
        </div>

        <div class="dashboard-section">
          <h2>🤖 Agent Actif</h2>
          <div class="agent-badge" id="current-agent-badge">AUCUN</div>
        </div>

        <div class="dashboard-section">
          <h2>⏳ Progression</h2>
          <div class="metric-item">
            <div class="metric-label" id="progress-label">En attente...</div>
            <div class="progress-bar">
              <div
                class="progress-fill"
                id="progress-bar"
                style="width: 0%"
              ></div>
            </div>
          </div>
        </div>

        <div class="dashboard-section">
          <h2>📋 Historique</h2>
          <div id="history-list" style="max-height: 250px; overflow-y: auto">
            <div
              style="
                color: #888;
                font-size: 12px;
                padding: 10px;
                text-align: center;
              "
            >
              Aucune conversation
            </div>
          </div>
        </div>

        <div id="sources-container" style="display: none">
          <h3>🔍 Sources</h3>
        </div>
      </div>

      <!-- MAIN CHAT -->
      <div id="main">
        <div id="chat-container">
          <div id="chat-messages"></div>
        </div>

        <div id="input-zone">
          <div id="attachments-preview"></div>
          <div id="input-container">
            <input
              type="file"
              id="file-input"
              multiple
              accept="image/*,.pdf,.txt,.csv,.json,.md,.py,.js,.html,.css"
            />
            <div class="attach-wrapper">
              <button id="attach-btn" title="Joindre un fichier">+</button>
              <div class="attach-dropdown" id="attach-dropdown">
                <div class="attach-dropdown-item" data-action="image">
                  <span class="icon">🖼️</span>
                  <span>Image</span>
                </div>
                <div class="attach-dropdown-item" data-action="pdf">
                  <span class="icon">📄</span>
                  <span>PDF</span>
                </div>
                <div class="attach-dropdown-divider"></div>
                <div class="attach-dropdown-item" data-action="code">
                  <span class="icon">💻</span>
                  <span>Code</span>
                </div>
                <div class="attach-dropdown-item" data-action="text">
                  <span class="icon">📝</span>
                  <span>Texte</span>
                </div>
                <div class="attach-dropdown-item" data-action="all">
                  <span class="icon">📎</span>
                  <span>Tous fichiers</span>
                </div>
              </div>
            </div>
            <select id="mode-selector" class="mode-selector">
              <option value="auto">🔮 Auto</option>
              <option value="agent">🤖 Agent</option>
              <option value="pipeline">🔄 Pipeline</option>
            </select>
            <select
              id="agent-selector"
              class="agent-selector"
              style="display: none"
            >
              <option value="">Sélectionner un agent...</option>
              <option value="stratege">Stratege</option>
              <option value="eclaireur">Eclaireur</option>
              <option value="senior">Senior</option>
              <option value="junior">Junior</option>
              <option value="prof">Prof</option>
              <option value="ecrivain">Ecrivain</option>
              <option value="hacker">Hacker</option>
              <option value="veilleur">Veilleur</option>
              <option value="medecin">Medecin</option>
              <option value="vision">Vision</option>
              <option value="nolimit">Nolimit</option>
              <option value="savant">Savant</option>
              <option value="historien">Historien</option>
            </select>
            <select
              id="pipeline-selector"
              class="pipeline-selector"
              style="display: none"
            >
              <option value="">Sélectionner un pipeline...</option>
              <option value="code_review">Code Review</option>
              <option value="code_secure">Code Secure</option>
              <option value="story_polish">Story Polish</option>
              <option value="exploit_code">Exploit Code</option>
              <option value="analyze_code">Analyze Code</option>
              <option value="learning_guide">Learning Guide</option>
              <option value="debug_fix">Debug Fix</option>
              <option value="full_stack">Full Stack</option>
              <option value="doc_code">Doc Code</option>
              <option value="refactor">Refactor</option>
              <option value="phoenix">Phoenix</option>
              <option value="shark_tank">Shark Tank</option>
              <option value="research_deep">Research Deep</option>
              <option value="audit_full">Audit Full</option>
              <option value="optimize_legacy">Optimize Legacy</option>
              <option value="clone_ui">Clone UI</option>
            </select>
            <textarea
              id="user-input"
              placeholder="Posez votre question... (Shift+Enter pour nouvelle ligne)"
              rows="1"
            ></textarea>
            <button id="send-btn">ENVOYER ⚡</button>
          </div>
        </div>
      </div>
    </div>

    <!-- MODAL DE CONFIRMATION -->
    <div class="modal-overlay" id="confirm-modal">
      <div class="modal-content">
        <div class="modal-title">
          <span>⚠️</span>
          <span id="confirm-title">Confirmation</span>
        </div>
        <div class="modal-message" id="confirm-message">Êtes-vous sûr ?</div>
        <div class="modal-buttons">
          <button class="modal-btn modal-btn-cancel" id="confirm-cancel">
            Annuler
          </button>
          <button class="modal-btn modal-btn-confirm" id="confirm-ok">
            Confirmer
          </button>
        </div>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
